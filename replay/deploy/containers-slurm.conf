# Podman settings for the SLURM jobs (CONTAINERS_CONF_OVERRIDE in
# job_setup.sbatch and job_e2e.sbatch). With the default systemd cgroup
# manager, rootless containers are placed under the user's systemd service,
# i.e. in user.slice, which this node caps at CPUQuota=10% and MemoryMax=2G
# for everyone (/etc/systemd/system/user.slice.d/limits.conf). cgroupfs keeps
# them inside the job's own cgroup, so they get the job's allocation.
[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
